name: CI

# PR時とpush時にテスト/Lintを自動実行する
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一ブランチの古い実行はキャンセル（無駄なCI時間を節約）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: テスト (pytest + カバレッジ)
        run: pytest --cov=cart --cov-report=term-missing --cov-report=xml

      - name: カバレッジをジョブSummaryに出力
        if: always()
        run: |
          echo "### テスト結果 (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              rate = float(root.get("line-rate", 0)) * 100
              print(f"- ライン カバレッジ: **{rate:.1f}%**")
          except Exception as e:
              print(f"- カバレッジ取得失敗: {e}")
          PY
